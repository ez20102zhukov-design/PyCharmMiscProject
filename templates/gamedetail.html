{% extends "base.html" %}
{% block title %}{{ game.title }} — GameHub{% endblock %}
{% block content %}
<p class="page-lead"><a href="/">← К каталогу</a></p>
<h1 class="page-title">{{ game.title }}</h1>
<div class="detail-layout">
    <div class="detail-cover">
        <img src="{{ game.image_url.url }}" alt="{{ game.title }}">
    </div>
    <div class="detail-panel">
        <div class="detail-meta">
            <span class="detail-pill">Рейтинг {{ game.rating }}/10</span>
            <span class="detail-pill">Релиз {{ game.release|date:"d.m.Y" }}</span>
        </div>
        <div class="detail-description">
            <h2>Описание</h2>
            <p>{{ game.description }}</p>
        </div>
        <div class="detail-actions">
            <a class="btn btn--primary" href="{{ game.steam_url }}" target="_blank" rel="noopener noreferrer">Страница в Steam</a>
            <a class="btn btn--secondary" href="/">Вернуться в каталог</a>
        </div>
    </div>
</div>
{% endblock %}
